name: VetMed
options:
  bundleIdPrefix: de.tobwil
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: 5T32K4L4T4
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GRDB:
    url: https://github.com/sqlcipher/GRDB.swift.git
    exactVersion: 7.11.1
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.19.0
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.31.4
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.10.1
  Tokenizers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.3.4
targets:
  VetMed:
    type: application
    platform: iOS
    sources:
      - VetMed
      - path: ../../shared/prompts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tobwil.vetmed
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SQLCipher
        product: SQLCipher
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Tokenizers
        product: Tokenizers
    info:
      path: VetMed/Info.plist
      properties:
        CFBundleDisplayName: VetMed
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: VetMed nimmt bewusst gestartete Diktate lokal auf.
        NSSpeechRecognitionUsageDescription: VetMed transkribiert Diktate ausschließlich auf diesem iPhone.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  VetMedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VetMedTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VetMed
  VetMedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VetMedUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VetMed
schemes:
  VetMed:
    build:
      targets:
        VetMed: all
    test:
      targets: [VetMedTests, VetMedUITests]
